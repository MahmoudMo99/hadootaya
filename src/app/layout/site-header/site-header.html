<header class="site-header">
  <div class="header-shell">
    <a routerLink="/" class="brand" aria-label="حدوتاية - الصفحة الرئيسية" (click)="closeMenu()">
      <span class="brand__symbol" aria-hidden="true">
        <span>ح</span>
      </span>

      <span class="brand__identity">
        <span class="brand__name"> حدوتاية<span>.</span> </span>
        <span class="brand__tagline"> حكاية على قد وقتك </span>
      </span>
    </a>

    <nav class="desktop-nav" aria-label="التنقل الرئيسي">
      <a
        routerLink="/"
        class="nav-link"
        [class.is-active]="activeSection() === 'home'"
        [attr.aria-current]="activeSection() === 'home' ? 'page' : null"
      >
        الرئيسية
      </a>

      <a
        routerLink="/"
        fragment="stories"
        class="nav-link"
        [class.is-active]="activeSection() === 'stories'"
        [attr.aria-current]="activeSection() === 'stories' ? 'location' : null"
      >
        استكشف الحكايات
      </a>

      <a
        routerLink="/"
        fragment="about"
        class="nav-link"
        [class.is-active]="activeSection() === 'about'"
        [attr.aria-current]="activeSection() === 'about' ? 'location' : null"
      >
        عن حدوتاية
      </a>
    </nav>

    <div class="header-actions">
      <a routerLink="/" fragment="stories" class="header-cta">
        <span>اقرأ حدوتة</span>

        <span class="header-cta__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M19 12H5M5 12L11 6M5 12L11 18"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
      </a>

      <button
        #menuButton
        type="button"
        class="menu-toggle"
        [class.is-open]="isMenuOpen()"
        [attr.aria-expanded]="isMenuOpen()"
        [attr.aria-label]="isMenuOpen() ? 'إغلاق القائمة' : 'فتح القائمة'"
        aria-controls="mobile-navigation"
        (click)="toggleMenu()"
      >
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  @if (isMenuOpen()) {
    <button
      type="button"
      class="mobile-backdrop"
      aria-label="إغلاق القائمة"
      (click)="closeMenu(true)"
    ></button>
  }

  <nav
    id="mobile-navigation"
    class="mobile-panel"
    [class.is-open]="isMenuOpen()"
    [attr.inert]="isMenuOpen() ? null : ''"
    [attr.aria-hidden]="!isMenuOpen()"
    aria-label="قائمة الموبايل"
  >
    <div class="mobile-panel__intro">
      <span>فين هتاخدنا الحكاية النهارده؟</span>
      <span aria-hidden="true">✳</span>
    </div>

    <a routerLink="/" (click)="closeMenu()">
      <span class="mobile-panel__index">01</span>
      <span>الرئيسية</span>
      <span aria-hidden="true">↖</span>
    </a>

    <a routerLink="/" fragment="stories" (click)="closeMenu()">
      <span class="mobile-panel__index">02</span>
      <span>استكشف الحكايات</span>
      <span aria-hidden="true">↖</span>
    </a>

    <a routerLink="/" fragment="about" (click)="closeMenu()">
      <span class="mobile-panel__index">03</span>
      <span>عن حدوتاية</span>
      <span aria-hidden="true">↖</span>
    </a>

    <a routerLink="/" fragment="stories" class="mobile-panel__cta" (click)="closeMenu()">
      <span>يلا نبدأ الحكاية</span>
      <span aria-hidden="true">←</span>
    </a>

    <p class="mobile-panel__footer">حكايات صغيرة. عوالم كبيرة.</p>
  </nav>
</header>
